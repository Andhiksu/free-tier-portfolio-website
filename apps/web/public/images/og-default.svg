<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Decorative Grid Pattern -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.6">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Content Container -->
  <g transform="translate(100, 160)">
    <text x="0" y="40" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="3">DATA · STRATEGY · APPLIED AI</text>
    <text x="0" y="120" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800">Portfolio Owner</text>
    <text x="0" y="180" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400">Data Analytics, Business Intelligence & Applied AI Portfolio</text>
    <!-- Badge Tags -->
    <rect x="0" y="240" width="180" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="271" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Data Analyst</text>
    <rect x="200" y="240" width="220" height="48" rx="24" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="310" y="271" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">BI & Decision Support</text>
    <rect x="440" y="240" width="200" height="48" rx="24" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="540" y="271" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Applied AI / ML</text>
  </g>
</svg>
